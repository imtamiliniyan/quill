name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/quill
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/quill

      - name: strip
        run: strip -x dist/quill

      - name: package
        run: |
          cd dist
          tar -czf quill-macos-arm64.tar.gz quill
          shasum -a 256 quill-macos-arm64.tar.gz > quill-macos-arm64.tar.gz.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/quill-macos-arm64.tar.gz
            dist/quill-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Builds still run automatically on every tag push, but the
          # release itself lands as a draft: not visible, not "latest,"
          # not downloadable by anyone until a human clicks "Publish
          # release" on GitHub. This tag push -> unattended public
          # release pipeline had no approval gate before (confirmed: it
          # fired 3 times unattended while this repo was still private,
          # each time silently attaching an unsigned CLI-only tarball,
          # not the actual signed .app/.dmg users should get) - this is
          # the fix for that.
          draft: true
